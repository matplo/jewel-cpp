name: Build, test, and publish JEWEL wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested wheels to PyPI
        type: boolean
        default: false

permissions:
  contents: read

env:
  HEPYY_RELEASE: '0.2.32'

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PATH: /opt/python/cp312-cp312/bin:/opt/rh/gcc-toolset-14/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "hepyy[hepbundle]==$HEPYY_RELEASE" wheel cmake auditwheel patchelf twine
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python tools/build_hepyy_wheel.py --output raw-wheels --source-revision "$GITHUB_SHA"
      - name: Audit the wheel and keep Pythia8 in its own distribution
        run: |
          pythia_lib_dir=$(python -c 'from hepyy.native import wheel_record; print(wheel_record("pythia8")["lib_dir"])')
          LD_LIBRARY_PATH="$pythia_lib_dir" auditwheel repair \
            --plat manylinux_2_28_x86_64 --exclude libpythia8.so \
            -w wheelhouse raw-wheels/*.whl
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: jewel-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux-test:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matplo/hepyy
          ref: a0564faf17aab25c09f343bc36ae04b35b015ee0
          path: hepyy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: jewel-manylinux-x86_64
          path: wheelhouse
      - name: Test the installed wheel and FastJet examples
        run: |
          python -m venv "$RUNNER_TEMP/jewel-wheel-test"
          source "$RUNNER_TEMP/jewel-wheel-test/bin/activate"
          python -m pip install --find-links wheelhouse './hepyy[cppyy,hepbundle,jewel-cpp]' nbclient ipykernel
          python -m pip check
          python -m ipykernel install --sys-prefix --name jewel-wheel-test
          HEPYY_PACKAGES_DIR="$RUNNER_TEMP/empty-registry" python tools/test_hepyy_wheel.py

  macos:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matplo/hepyy
          ref: a0564faf17aab25c09f343bc36ae04b35b015ee0
          path: hepyy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "hepyy[hepbundle]==$HEPYY_RELEASE" wheel twine
      - run: |
          python tools/build_hepyy_wheel.py --output wheelhouse --source-revision "$GITHUB_SHA"
          python -m twine check --strict wheelhouse/*.whl
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: jewel-wheel-test
          python-version: '3.12'
          channels: conda-forge
          conda-remove-defaults: true
      - name: Test the installed wheel and FastJet examples
        shell: bash -el {0}
        run: |
          conda install -y cppyy pip
          python -m pip install --find-links wheelhouse './hepyy[hepbundle,jewel-cpp]' nbclient ipykernel
          python -m pip check
          python -m ipykernel install --sys-prefix --name jewel-wheel-test
          HEPYY_PACKAGES_DIR="$RUNNER_TEMP/empty-registry" python tools/test_hepyy_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: jewel-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: inputs.publish && github.repository == 'matplo/jewel-cpp' && github.ref == 'refs/heads/main'
    needs: [linux-test, macos]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hepyy-jewel-cpp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jewel-*
          merge-multiple: true
          path: dist
      - name: Require all three tested wheel tags
        run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 3
          for tag in manylinux_2_28_x86_64 macosx_11_0_arm64 macosx_11_0_x86_64; do
            compgen -G "dist/hepyy_jewel_cpp-0.2.0.1-py3-none-*${tag}*.whl" >/dev/null
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
