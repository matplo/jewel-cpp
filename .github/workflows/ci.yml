name: C++ build and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pythia8, LHAPDF and CT14nlo
        run: |
          python3 -m venv "$RUNNER_TEMP/jewel-venv"
          python="$RUNNER_TEMP/jewel-venv/bin/python"
          "$python" -m pip install 'hepyy-pythia8==8.317.6' 'hepyy-lhapdf==6.5.5.5'
          packages=$("$python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          pdf_data="$packages/hepyy_lhapdf/share/LHAPDF"
          mkdir -p "$pdf_data"
          curl --fail --location --retry 3 https://lhapdfsets.web.cern.ch/current/CT14nlo.tar.gz -o "$RUNNER_TEMP/CT14nlo.tar.gz"
          tar -xzf "$RUNNER_TEMP/CT14nlo.tar.gz" -C "$pdf_data"
          test -s "$pdf_data/CT14nlo/CT14nlo_0000.dat"
          {
            echo "JEWEL_CI_PYTHON=$python"
            echo "JEWEL_CI_PACKAGES=$packages"
            echo "LHAPDF_DATA_PATH=$pdf_data"
          } >> "$GITHUB_ENV"
      - name: Configure
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DPython3_EXECUTABLE="$JEWEL_CI_PYTHON" \
            -DJEWEL_WITH_PYTHIA8=ON \
            -DJEWEL_PYTHIA8_ROOT="$JEWEL_CI_PACKAGES/hepyy_pythia8" \
            -DJEWEL_LHAPDF_ROOT="$JEWEL_CI_PACKAGES/hepyy_lhapdf"
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Run the native suite
        run: |
          ctest --test-dir build-ci --show-only=json-v1 |
            "$JEWEL_CI_PYTHON" -c 'import json, sys; n = len(json.load(sys.stdin)["tests"]); sys.exit(f"Expected at least 54 tests, found {n}" if n < 54 else 0)'
          ctest --test-dir build-ci --parallel 2 --output-on-failure --no-tests=error --timeout 600
